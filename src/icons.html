         * { margin: 0; padding: 0; list-style: none; }
         body { color: var(--text-color); font: 12px/1.5 tahoma, arial, sans-serif; }
         a { color: #333; text-decoration: underline; }
         a:hover { color: var(--primary-color); }
         .icon { font-family: 'IconFont'; font-size: 24px; transition: all 0.4s ease; }
         .header { color: #333; text-align: center; padding: 80px 0 40px 0; font-size: 14px; }
         .header .logo svg { height: 120px; width: 120px; }
         .header h1 { font-size: 42px; padding: 26px 0 10px 0; }
         .header h1 span { text-transform: capitalize; }
         .header sup { font-size: 14px; margin: 8px 0 0 8px; position: absolute; color: #7b7b7b; }
         .info { color: #999; font-weight: normal; max-width: 346px; margin: 0 auto; font-size: 12px; transition: all 0.4s ease; text-align: left; }
         .info td { padding: 2px 0; }
         .info .info-value { padding-left: 5px; }
         .info .info-value span { cursor: pointer; transition: all 0.4s ease; }
         .info .info-value span:hover { color: var(--primary-color); }
         .copy-message { text-align: center; padding: 5px 20px; position: absolute; top: 0; left: 50%; transform: translateX(-50%); color: var(--primary-color); border-radius: 3px; border: 1px solid var(--primary-color); opacity: 0; transition: all 0.4s ease; }
         .copy-show .copy-message { opacity: 1; }
         .icons { position: relative; max-width: 1190px; margin: 0 auto; padding-top: 40px; }
         .icons ul { text-align: center; }
         .icons ul li { vertical-align: top; width: 160px; display: inline-block; text-align: center; background-color: rgba(0, 0, 0, 0.02); border-radius: 3px; padding: 20px 15px; margin-right: 10px; margin-top: 10px; transition: all 0.4s ease; }
         .icons ul li:hover { background-color: var(--hover-bg); }
         .icons ul li:hover span.icon { color: var(--primary-color); opacity: 1; }
         .icons ul li h4 { font-weight: normal; padding: 10px 0 5px 0; display: block; color: #8c8c8c; font-size: 15px; line-height: 12px; opacity: 0.8; transition: all 0.4s ease; margin-bottom: 10px; }
         .icons ul li:hover h4 { opacity: 1; color: var(--primary-color); }
         .icons ul li:hover .info { color: #616161; }
      </style>
         </head>
         <body>
            <div class="header">
               <h1><span>ViteTemplateHTML</span> icons<sup>2.0.0</sup></h1>
            </div>
            <div class="icons">
               <div data-copy-message class="copy-message">qweqwe</div>
               <ul>
      <li>
         <span class="icon _icon-Group">&#983040;</span>
         <h4 class="name">Group</h4>
         <table class="info">
            <tr>
               <td>class:</td>
               <td class="info-value"><span data-copy="_icon-Group" title="Click to copy">_icon-Group</span></td>
            </tr>
            <tr>
               <td>unicode:</td>
               <td class="info-value"><span data-copy="&amp;#983040;" title="Click to copy">&amp;#983040;</span></td>
            </tr>
            <tr>
               <td>encoded:</td>
               <td class="info-value"><span data-copy="\f0000" title="Click to copy">\f0000</span></td>
            </tr>
         </table>
      </li>
      <li>
         <span class="icon _icon-Vector">&#983041;</span>
         <h4 class="name">Vector</h4>
         <table class="info">
            <tr>
               <td>class:</td>
               <td class="info-value"><span data-copy="_icon-Vector" title="Click to copy">_icon-Vector</span></td>
            </tr>
            <tr>
               <td>unicode:</td>
               <td class="info-value"><span data-copy="&amp;#983041;" title="Click to copy">&amp;#983041;</span></td>
            </tr>
            <tr>
               <td>encoded:</td>
               <td class="info-value"><span data-copy="\f0001" title="Click to copy">\f0001</span></td>
            </tr>
         </table>
      </li></ul>
            </div>
            <script>
               let timeoutId = null;
               document.addEventListener('click', ({ target }) => {
                  const copyValue = target.dataset.copy;
                  const copyModal = document.querySelector('[data-copy-message]');
                  if (!copyValue) return;
                  if (timeoutId) clearTimeout(timeoutId);
                  navigator.clipboard.writeText(copyValue).then(() => {
                     copyModal.textContent = `Copied: ${copyValue}`;
                     document.documentElement.classList.add('copy-show');
                     timeoutId = setTimeout(() => document.documentElement.classList.remove('copy-show'), 1500);
                  }).catch((error) => {
                     copyModal.textContent = `Failed to copy: ${error}`;
                     document.documentElement.classList.add('copy-show');
                     timeoutId = setTimeout(() => document.documentElement.classList.remove('copy-show'), 1500);
                  });
               });
            </script>
         </body>
